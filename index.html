<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let p = 100000;
        let r = 0.10;
        let n = 1;
        let t = 3;
        let A = p * Math.pow((1 + r / n), n * t);
        let CI = A - p;
        console.log("Compound Interest: " + t + " years is: " + CI);
    </script>
</body>
</html>
